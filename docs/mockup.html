<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowcrumbs</title>
<style>:root {
  --bg: #070b08;
  --panel: #0d140f;
  --panel2: #111b14;
  --line: #1f3326;
  --text: #c4f7d2;
  --dim: #7ba487;
  --accent: #3dff7a;
  --accent-ink: #04210f;
  --amber: #ffb000;
  --red: #ff6b6b;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--mono); }
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: 0.04em; }
h2 { font-size: 18px; }
h3 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; }
.dim { color: var(--dim); }
.error { color: var(--red); min-height: 1.4em; margin: 4px 0; }
.ok { color: var(--accent); }
.warn { color: var(--amber); }

/* header and tabs */
.top { border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 16px; padding: 12px 20px 4px; flex-wrap: wrap; }
.logo { color: var(--accent); font-weight: 700; letter-spacing: 0.22em; font-size: 16px; text-shadow: 0 0 12px rgba(61, 255, 122, 0.45); }
.tagline { color: var(--dim); font-size: 12px; }
.tabs { display: flex; gap: 2px; padding: 0 16px; overflow-x: auto; scrollbar-width: thin; }
.tab {
  background: transparent; color: var(--dim); border: 1px solid transparent; border-bottom: none;
  padding: 8px 14px; font: inherit; cursor: pointer; white-space: nowrap; border-radius: 6px 6px 0 0;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--bg); color: var(--accent); border-color: var(--line); position: relative; top: 1px; }
.tab .n { color: var(--dim); margin-left: 8px; font-size: 12px; }
.tab.new { color: var(--accent); }

/* layout */
main { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.card > h3 { margin-bottom: 10px; }
.empty { text-align: center; padding: 60px 20px; }
.empty p { color: var(--dim); max-width: 52ch; margin: 10px auto 20px; }

.target { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 8px; }
.target div { min-width: 140px; }
.target .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; }
.target .v { word-break: break-all; }

/* scope */
.scope { display: grid; gap: 10px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; border: 1px solid; letter-spacing: 0.06em; }
.badge.on { color: var(--accent); border-color: var(--accent); }
.badge.off { color: var(--amber); border-color: var(--amber); }
.badge.active { color: var(--amber); border-color: var(--amber); margin-left: 8px; }
.scope form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.scope input[type="text"] { flex: 1 1 260px; }

/* controls */
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--panel2); color: var(--dim); border: none; padding: 8px 14px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.spacer { flex: 1; }
.status { color: var(--dim); min-height: 1.5em; margin-top: 10px; }
.status.running { color: var(--accent); }
.status.running::after { content: " ▌"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .status.running::after { animation: none; } }

/* buttons and inputs */
.btn {
  font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel2); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.1); }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
input[type="text"], input:not([type]), input[type="search"] {
  background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; width: 100%;
}
input:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="checkbox"] { accent-color: var(--accent); }

/* plugins */
.plugins { display: grid; gap: 6px; }
.plugin { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); align-items: center; }
.plugin .name { color: var(--text); font-weight: 600; }
.plugin .desc { color: var(--dim); font-size: 12px; grid-column: 1; }
.plugin .last { color: var(--dim); font-size: 12px; grid-column: 1; }
.plugin .btn { grid-column: 2; grid-row: 1 / span 3; }

/* findings */
.cats { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.cats button { background: var(--panel2); color: var(--dim); border: 1px solid var(--line); padding: 6px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
.cats button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.cats .n { margin-left: 6px; }
.filter { margin-bottom: 10px; max-width: 360px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 10px; border-bottom: 1px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.val { word-break: break-all; }
td.notes { color: var(--dim); font-size: 12px; max-width: 420px; }
td.num { width: 56px; }
.conf { display: inline-block; min-width: 2.2em; text-align: right; }
tr.verified td.val { color: var(--accent); }
.src { color: var(--dim); font-size: 12px; }
.none { color: var(--dim); padding: 20px 0; }

/* runs */
details summary { cursor: pointer; color: var(--dim); }
.runlog { margin-top: 10px; }
.runlog td { font-size: 12px; }
.st-ok { color: var(--accent); }
.st-error { color: var(--red); }
.st-partial, .st-skipped { color: var(--amber); }
.st-running { color: var(--text); }

/* dialog */
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 10px; padding: 22px; width: min(520px, 92vw); }
dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
dialog form { display: grid; gap: 12px; }
dialog label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
dialog label.check { display: flex; gap: 8px; align-items: center; color: var(--text); }
dialog .row { display: flex; gap: 10px; justify-content: flex-end; }

@media (max-width: 640px) {
  main { padding: 12px; }
  .plugin { grid-template-columns: 1fr; }
  .plugin .btn { grid-column: 1; grid-row: auto; justify-self: start; }
}

.sample{position:fixed;right:12px;top:10px;z-index:9;padding:6px 10px;border:1px solid #f0b429;color:#f0b429;background:#0b120c;font:12px monospace;border-radius:6px}</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">SHADOWCRUMBS</span>
    <span class="tagline">the crumbs they left behind, one tab per client</span>
  </div>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Engagements"></nav>
</header>

<main id="main"></main>

<dialog id="new-dlg">
  <form id="new-form" method="dialog" autocomplete="off">
    <h2>New engagement</h2>
    <p class="dim">Give it a name and at least one target. Add the authorization reference now or later. Deep dive stays locked until you do.</p>
    <label>Engagement name <input name="name" required placeholder="Client Q4 external"></label>
    <label>Company <input name="company" placeholder="Acme Corp"></label>
    <label>Domain <input name="domain" placeholder="acme.com"></label>
    <label>IP or CIDR range <input name="ip" placeholder="203.0.113.0/28"></label>
    <label>Authorization reference <input name="auth_ref" placeholder="SOW 2026-114, ROE signed 10/01"></label>
    <label class="check"><input type="checkbox" name="authorized"> I have written authorization to test this target</label>
    <p id="new-error" class="error" role="alert"></p>
    <div class="row">
      <button type="button" class="btn ghost" id="new-cancel">Cancel</button>
      <button type="submit" class="btn primary">Create</button>
    </div>
  </form>
</dialog>

const SLUG = "acme-demo-corp";
const json = (d, s = 200) => new Response(s === 204 ? null : JSON.stringify(d), { status: s, headers: { "Content-Type": "application/json" } });
window.fetch = async (path, opts = {}) => {
  const method = (opts.method || "GET").toUpperCase();
  const body = opts.body ? JSON.parse(opts.body) : {};
  const m = path.match(/^\/api\/engagements\/[^/]+\/findings\/(\d+)$/);
  if (path === "/api/meta") return json(SAMPLE.meta);
  if (path === "/api/engagements" && method === "GET") return json(SAMPLE.list);
  if (path === `/api/engagements/${SLUG}` && method === "GET") return json(SAMPLE.eng);
  if (path === `/api/engagements/${SLUG}/runs` && method === "GET") return json(SAMPLE.runs);
  if (path.startsWith(`/api/engagements/${SLUG}/findings`) && method === "GET") return json(SAMPLE.findings);
  if (m && method === "PATCH") { const f = SAMPLE.findings.find((x) => x.id == m[1]); if (f && "verified" in body) f.verified = body.verified; return json({ ok: true }); }
  if (m && method === "DELETE") { SAMPLE.findings = SAMPLE.findings.filter((x) => x.id != m[1]); return json(null, 204); }
  return json({ detail: "Sample mode: this mockup is read-only. Run the real thing with ./start.sh --demo." }, 409);
};

<script>"use strict";

// Everything scraped from the web is rendered with textContent only. Never innerHTML.

const state = {
  meta: null,
  engagements: [],
  active: null,
  tier: "search",
  category: "employees",
  filter: "",
  findings: [],
  runs: [],
  runStatus: { state: "idle" },
  notice: null,
  poll: null,
};

const $ = (sel, root = document) => root.querySelector(sel);

// replaceChildren stringifies null and false into visible text, so drop them first.
function replaceKids(host, ...kids) {
  host.replaceChildren(...kids.filter((k) => k != null && k !== false));
}

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

function safeUrl(u) {
  try {
    const url = new URL(u);
    return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
  } catch {
    return null;
  }
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `${res.status} ${res.statusText}`);
  return data;
}

const active = () => state.engagements.find((e) => e.slug === state.active);
const totalOf = (e) => Object.values(e.counts || {}).reduce((a, b) => a + b, 0);

// tabs ---------------------------------------------------------------

function renderTabs() {
  const nav = $("#tabs");
  nav.replaceChildren(
    ...state.engagements.map((e) =>
      el("button", {
        class: "tab", role: "tab", "aria-selected": String(e.slug === state.active),
        onclick: () => selectEngagement(e.slug),
      }, e.name, el("span", { class: "n" }, totalOf(e)))
    ),
    el("button", { class: "tab new", onclick: openNewDialog }, "+ NEW")
  );
}

// main ---------------------------------------------------------------

function renderMain() {
  const main = $("#main");
  const e = active();
  if (!e) {
    main.replaceChildren(
      el("section", { class: "card empty" },
        el("h2", {}, "No engagements yet"),
        el("p", {}, "Start one per client. Each gets its own tab and its own database, so nothing crosses over."),
        el("button", { class: "btn primary", onclick: openNewDialog }, "New engagement"))
    );
    return;
  }
  main.replaceChildren(
    el("section", { class: "card", id: "head" }),
    el("section", { class: "card", id: "controls" }),
    el("section", { class: "card", id: "plugins" }),
    el("section", { class: "card", id: "findings" }),
    el("section", { class: "card", id: "runs" })
  );
  renderHead();
  renderControls();
  renderPlugins();
  renderFindings();
  renderRuns();
}

function renderHead() {
  const e = active();
  if (!e) return;
  const host = $("#head");
  const kv = (k, v) => el("div", {}, el("div", { class: "k" }, k), el("div", { class: "v" }, v || "not given"));
  const refInput = el("input", { type: "text", id: "auth-ref", value: e.auth_ref || "", placeholder: "Authorization reference (SOW, ROE, ticket)" });
  const authBox = el("input", { type: "checkbox", id: "auth-box", checked: e.authorized });
  const scopeForm = el("form", {
    onsubmit: async (ev) => {
      ev.preventDefault();
      try {
        await api(`/api/engagements/${e.slug}`, {
          method: "PATCH",
          body: { auth_ref: refInput.value, authorized: authBox.checked },
        });
        state.notice = null;
        await loadEngagements();
        renderTabs();
        renderHead();
        renderControls();
      } catch (err) {
        state.notice = { kind: "error", text: err.message };
        renderControls();
      }
    },
  },
    refInput,
    el("label", { class: "dim" }, authBox, " authorized for active testing"),
    el("button", { class: "btn small", type: "submit" }, "Save scope")
  );

  host.replaceChildren(
    el("div", { class: "controls" },
      el("h2", {}, e.name),
      el("span", { class: e.authorized ? "badge on" : "badge off" }, e.authorized ? "DEEP DIVE UNLOCKED" : "DEEP DIVE LOCKED"),
      el("span", { class: "spacer" }),
      el("button", {
        class: "btn small danger",
        onclick: async () => {
          if (!confirm(`Delete "${e.name}" and all its findings? This cannot be undone.`)) return;
          try {
            await api(`/api/engagements/${e.slug}`, { method: "DELETE" });
            state.active = null;
            await loadEngagements();
            if (state.engagements.length) await selectEngagement(state.engagements[0].slug);
            else { renderTabs(); renderMain(); }
          } catch (err) {
            state.notice = { kind: "error", text: err.message };
            renderControls();
          }
        },
      }, "Delete engagement")),
    el("div", { class: "target" }, kv("Company", e.company), kv("Domain", e.domain), kv("IP or range", e.ip)),
    el("div", { class: "scope", style: "margin-top:14px" },
      el("h3", {}, "Scope"),
      scopeForm,
      !e.authorized && el("div", { class: "dim" }, "Search tier works without this. Deep dive sends traffic to the client, so it waits for a reference you can point to later."))
  );
}

function renderControls() {
  const e = active();
  const host = $("#controls");
  if (!e) return;
  const running = state.runStatus.state === "running";
  const locked = state.tier === "deep" && !e.authorized;
  const exportLink = (fmt, label) =>
    el("a", { class: "btn", href: `/api/engagements/${e.slug}/export?format=${fmt}`, download: true }, label);

  let statusText = "Idle.";
  let statusClass = "status";
  if (running) {
    const s = state.runStatus;
    statusText = `Running ${s.tier} tier: ${s.current || "starting"} (${s.done}/${s.total})`;
    statusClass = "status running";
  } else if (state.runStatus.error) {
    statusText = state.runStatus.error;
  } else if (state.runStatus.summary) {
    const s = state.runStatus.summary;
    statusText = `Last run: ${s.new_findings} new finding${s.new_findings === 1 ? "" : "s"}` +
      (s.searches_live != null ? `, ${s.searches_live} live search${s.searches_live === 1 ? "" : "es"}, ${s.searches_cached} from cache` : "") + ".";
  }

  replaceKids(host,
    el("div", { class: "controls" },
      el("div", { class: "seg", role: "group", "aria-label": "Mode" },
        el("button", { "aria-pressed": String(state.tier === "search"), onclick: () => setTier("search") }, "SEARCH"),
        el("button", { "aria-pressed": String(state.tier === "deep"), onclick: () => setTier("deep") }, "DEEP DIVE")),
      el("button", {
        class: "btn primary", disabled: running || locked,
        onclick: () => startRun(null),
      }, state.tier === "deep" ? "Run all deep dive sources" : "Run all search sources"),
      el("span", { class: "spacer" }),
      exportLink("md", "Export MD"), exportLink("pdf", "Export PDF"), exportLink("json", "Export JSON")),
    el("div", { class: statusClass, role: "status" }, statusText),
    state.notice && el("div", { class: state.notice.kind === "error" ? "error" : "warn" }, state.notice.text),
    locked && el("div", { class: "warn" }, "Deep dive is locked. Add an authorization reference under Scope above.")
  );
}

function lastRunFor(name) {
  return state.runs.find((r) => r.plugin === name);
}

function renderPlugins() {
  const e = active();
  const host = $("#plugins");
  if (!e) return;
  const running = state.runStatus.state === "running";
  const locked = state.tier === "deep" && !e.authorized;
  const list = state.meta.plugins.filter((p) => p.tier === state.tier);
  replaceKids(host,
    el("h3", {}, state.tier === "deep" ? "Deep dive sources" : "Search sources"),
    el("div", { class: "plugins" }, ...list.map((p) => {
      const last = lastRunFor(p.name);
      const lastText = last
        ? `${last.status}, ${last.found} new, ${last.started_at} UTC${last.error ? " | " + last.error : ""}`
        : "never run";
      return el("div", { class: "plugin" },
        el("div", { class: "name" }, p.name,
          p.touches_target && el("span", { class: "badge active", title: "Sends traffic to the client" }, "ACTIVE")),
        el("button", { class: "btn small", disabled: running || locked, onclick: () => startRun([p.name]) }, "Run"),
        el("div", { class: "desc" }, p.description),
        el("div", { class: "last" }, "Last: ", el("span", { class: last ? `st-${last.status}` : "" }, lastText)));
    })),
    Object.keys(state.meta.plugin_load_errors || {}).length > 0 &&
      el("div", { class: "error" }, "Plugin load errors: " +
        Object.entries(state.meta.plugin_load_errors).map(([f, m]) => `${f}: ${m}`).join("; "))
  );
}

function renderFindings() {
  const e = active();
  const host = $("#findings");
  if (!e) return;
  const counts = {};
  for (const f of state.findings) counts[f.category] = (counts[f.category] || 0) + 1;

  const rows = state.findings.filter((f) => {
    if (f.category !== state.category) return false;
    if (!state.filter) return true;
    const hay = `${f.value} ${f.notes || ""} ${f.plugins.join(" ")}`.toLowerCase();
    return hay.includes(state.filter.toLowerCase());
  });

  const cats = el("div", { class: "cats", role: "group", "aria-label": "Category" },
    ...state.meta.categories.map((c) =>
      el("button", {
        "aria-pressed": String(c.key === state.category),
        onclick: () => { state.category = c.key; renderFindings(); },
      }, c.label, el("span", { class: "n" }, counts[c.key] || 0))));

  const filter = el("input", {
    type: "search", class: "filter", placeholder: "Filter this list", value: state.filter, "aria-label": "Filter findings",
    oninput: (ev) => {
      state.filter = ev.target.value;
      renderFindings();
      const again = $("#findings .filter");
      again.focus();
      again.setSelectionRange(state.filter.length, state.filter.length);
    },
  });

  let body;
  if (!rows.length) {
    body = el("div", { class: "none" }, state.findings.length || state.filter
      ? "Nothing here."
      : "Nothing yet. Run the search sources to start collecting.");
  } else {
    body = el("div", { class: "tablewrap" }, el("table", {},
      el("thead", {}, el("tr", {}, ...["Finding", "Conf.", "Source", "Notes", ""].map((h) => el("th", {}, h)))),
      el("tbody", {}, ...rows.map(findingRow))));
  }
  host.replaceChildren(el("h3", {}, "Findings"), cats, filter, body);
}

function findingRow(f) {
  const href = f.url && safeUrl(f.url);
  const valueNode = href && f.category === "documents"
    ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, f.value)
    : f.value;
  const evidence = href && f.category !== "documents"
    ? el("div", {}, el("a", { href, target: "_blank", rel: "noopener noreferrer", class: "src" }, "evidence"))
    : null;
  return el("tr", { class: f.verified ? "verified" : "" },
    el("td", { class: "val" }, valueNode, evidence),
    el("td", { class: "num" }, el("span", { class: "conf" }, f.confidence)),
    el("td", { class: "src" }, f.plugins.join(", ")),
    el("td", { class: "notes" }, f.notes || ""),
    el("td", {},
      el("label", { class: "dim", title: "Mark as verified by you" },
        el("input", {
          type: "checkbox", checked: f.verified,
          onchange: async (ev) => {
            await api(`/api/engagements/${state.active}/findings/${f.id}`, { method: "PATCH", body: { verified: ev.target.checked } });
            f.verified = ev.target.checked;
            renderFindings();
          },
        }), " ok "),
      el("button", {
        class: "btn small danger", title: "Remove this finding",
        onclick: async () => {
          await api(`/api/engagements/${state.active}/findings/${f.id}`, { method: "DELETE" });
          state.findings = state.findings.filter((x) => x.id !== f.id);
          renderFindings();
          loadEngagements().then(renderTabs);
        },
      }, "Drop")));
}

function renderRuns() {
  const host = $("#runs");
  if (!host) return;
  const rows = state.runs.slice(0, 60);
  host.replaceChildren(el("details", {},
    el("summary", {}, `Run history (${state.runs.length})`),
    rows.length
      ? el("div", { class: "runlog tablewrap" }, el("table", {},
          el("thead", {}, el("tr", {}, ...["Source", "Tier", "Started (UTC)", "Status", "New", "Error"].map((h) => el("th", {}, h)))),
          el("tbody", {}, ...rows.map((r) => el("tr", {},
            el("td", {}, r.plugin), el("td", {}, r.tier), el("td", {}, r.started_at),
            el("td", { class: `st-${r.status}` }, r.status), el("td", {}, r.found), el("td", { class: "notes" }, r.error || ""))))))
      : el("div", { class: "none" }, "No runs yet.")));
}

// actions ------------------------------------------------------------

function setTier(tier) {
  state.tier = tier;
  state.notice = null;
  renderControls();
  renderPlugins();
}

async function startRun(names) {
  state.notice = null;
  try {
    state.runStatus = await api(`/api/engagements/${state.active}/runs`, {
      method: "POST", body: { tier: state.tier, plugins: names },
    });
    startPolling();
  } catch (err) {
    state.notice = { kind: "error", text: err.message };
  }
  renderControls();
  renderPlugins();
}

function startPolling() {
  stopPolling();
  state.poll = setInterval(refreshActive, 1500);
  refreshActive();
}

function stopPolling() {
  if (state.poll) clearInterval(state.poll);
  state.poll = null;
}

async function refreshActive() {
  if (!state.active) return stopPolling();
  const slug = state.active;
  try {
    const [runs, findings] = await Promise.all([
      api(`/api/engagements/${slug}/runs`),
      api(`/api/engagements/${slug}/findings`),
    ]);
    if (slug !== state.active) return;
    state.runStatus = runs.status;
    state.runs = runs.runs;
    state.findings = findings;
    renderControls();
    renderPlugins();
    renderFindings();
    renderRuns();
    if (runs.status.state !== "running") {
      stopPolling();
      await loadEngagements();
      renderTabs();
    }
  } catch (err) {
    state.notice = { kind: "error", text: err.message };
    stopPolling();
    renderControls();
  }
}

async function loadEngagements() {
  state.engagements = await api("/api/engagements");
}

async function selectEngagement(slug) {
  stopPolling();
  state.active = slug;
  state.filter = "";
  state.notice = null;
  state.findings = [];
  state.runs = [];
  state.runStatus = { state: "idle" };
  renderTabs();
  renderMain();
  await refreshActive();
  if (state.runStatus.state === "running") startPolling();
}

// new engagement dialog ----------------------------------------------

function openNewDialog() {
  $("#new-form").reset();
  $("#new-error").textContent = "";
  $("#new-dlg").showModal();
  $("#new-form [name=name]").focus();
}

function wireDialog() {
  $("#new-cancel").addEventListener("click", () => $("#new-dlg").close());
  $("#new-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    try {
      const created = await api("/api/engagements", {
        method: "POST",
        body: {
          name: f.get("name"), company: f.get("company"), domain: f.get("domain"),
          ip: f.get("ip"), auth_ref: f.get("auth_ref"), authorized: f.get("authorized") === "on",
        },
      });
      $("#new-dlg").close();
      await loadEngagements();
      await selectEngagement(created.slug);
    } catch (err) {
      $("#new-error").textContent = err.message;
    }
  });
}

// boot ---------------------------------------------------------------

async function boot() {
  wireDialog();
  state.meta = await api("/api/meta");
  await loadEngagements();
  renderTabs();
  if (state.engagements.length) await selectEngagement(state.engagements[0].slug);
  else renderMain();
}

boot().catch((err) => {
  $("#main").replaceChildren(el("section", { class: "card" }, el("div", { class: "error" }, `Could not start: ${err.message}`)));
});
</script>
